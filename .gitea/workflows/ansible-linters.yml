name: Ansible Linter

on:
  pull_request:
    types: [ "opened", "reopened", "synchronize" ]
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]

jobs:
  ansible-lint:
    runs-on:
    - ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run ansible-lint
      uses: ansible/ansible-lint@b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0
      with:
        args: "--config-file .ansible-lint.yml"
        # The molecule scenario is linted as well, so its collections are required beside the ones of the role.
        requirements_file: "molecule/default/collections.yml"
        setup_python: "true"
